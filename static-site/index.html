<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angela Won</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="nav">
      <a href="index.html" class="nav-logo">
        <span class="nav-logo-circle"><span><img src="../static-site/images/logo3.png" alt="Logo" width="60" height="60"></span></span>
        <span class="nav-logo-text">ANGELA WON</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link active">BOARD</a>
        <a href="about.html" class="nav-link">ABOUT ME</a>
      </div>
    </nav>

    <div class="board-container" id="board-container">
      <div class="board-canvas" id="board-canvas">
        <div class="board-halo"></div>

        <div id="board-photos"></div>

        <div class="board-center">
          <div class="board-blob">
            <h1>I'm Angela!</h1>
            <svg width="48" height="8" viewBox="0 0 48 8">
              <path d="M2 6 Q12 2 24 5 Q36 8 46 4" stroke="#c4908a" stroke-width="1.5" fill="none" stroke-linecap="round" />
            </svg>
            <p class="blob-tagline">Building passion for creativity &amp; strategy</p>
            <p class="blob-subtext">Studying UX Design &amp; AI @ University of Michigan</p>
          </div>
        </div>

        <div class="board-dot" style="top: 40%; left: 33%; width: 4px; height: 4px; opacity: 0.22; animation-duration: 5s; animation-delay: 0s;"></div>
        <div class="board-dot" style="top: 62%; left: 42%; width: 3px; height: 3px; opacity: 0.18; animation-duration: 6s; animation-delay: 1.5s;"></div>
        <div class="board-dot" style="top: 38%; left: 65%; width: 5px; height: 5px; opacity: 0.16; animation-duration: 7s; animation-delay: 3s;"></div>
        <div class="board-dot" style="top: 60%; left: 58%; width: 3px; height: 3px; opacity: 0.2; animation-duration: 8s; animation-delay: 2s;"></div>
      </div>
    </div>

    <div class="board-zoom-controls">
      <button class="board-zoom-btn" id="zoom-in" aria-label="Zoom in">+</button>
      <button class="board-zoom-btn" id="zoom-out" aria-label="Zoom out">&minus;</button>
      <button class="board-zoom-btn home-btn" id="zoom-reset" aria-label="Reset view">&#8962;</button>
    </div>

    <div class="board-hint">
      <span class="hint-text">scroll to explore</span>
      <span class="hint-dot">&#10022;</span>
      <span class="hint-text">click a photo to open</span>
    </div>

    <div class="modal-overlay" id="photo-modal">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-tab">
          <span id="modal-category-tab"></span>
        </div>
        <div class="modal-body">
          <div class="modal-photo">
            <img id="modal-image" src="" alt="" />
          </div>
          <div class="modal-text">
            <div>
              <p class="modal-category" id="modal-category"></p>
              <h2 class="modal-title" id="modal-title"></h2>
              <p class="modal-description" id="modal-description"></p>
            </div>
            <div class="modal-signature">
              <div class="line"></div>
              <span class="name">Angela Won</span>
            </div>
          </div>
        </div>
        <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      </div>
    </div>

    <script src="js/board.js"></script>
  </body>
</html>
